services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: efoot
      POSTGRES_PASSWORD: efoot
      POSTGRES_DB: efoot_market
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efoot -d efoot_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://efoot:efoot@db:5432/efoot_market
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"

volumes:
  pgdata:
